name: Testes e pacote
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,tui]"
      - run: python -m ruff check .
      - run: python -m unittest discover -s tests -v
      - run: python -m castle_invasion --validate-data
      - run: python -m pip wheel --no-deps --wheel-dir dist .

  windows-executable:
    if: github.event_name == 'push'
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[exe,tui]"
      - run: python scripts/build_exe.py
      - run: .\dist\CastleInvasion.exe --validate-data
      - uses: actions/upload-artifact@v4
        with:
          name: CastleInvasion-Windows
          path: dist/CastleInvasion.exe
